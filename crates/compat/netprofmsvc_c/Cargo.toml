[package]
name = "netprofmsvc_c"
version = "0.1.0"
edition = "2021"
description = "Compat DLL for the console netprofmsvc_c.dll (Network Profile service): the svchost globals push and the console DllMain (TraceLogging provider, aggregate state, wil failure callback); the service body is not ported."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "netprofmsvc_c"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
service = ["dep:compat-common", "dep:console-sandbox"]

[dependencies]
compat-common = { path = "../compat-common", optional = true }
console-sandbox = { path = "../console-sandbox", optional = true }

[build-dependencies]
xone-exports = { path = "../xone-exports" }

[dev-dependencies]
compat-common = { path = "../compat-common" }
console-sandbox = { path = "../console-sandbox" }
xone-exports = { path = "../xone-exports" }
